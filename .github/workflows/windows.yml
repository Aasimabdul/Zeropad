name: Windows CI
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build windows/ZeroPad.sln --configuration Release
      - name: Run protocol tests
        run: dotnet test windows/ZeroPad.sln --configuration Release --no-build
