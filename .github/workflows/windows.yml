name: Windows CI
on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build solution
        run: dotnet build windows/ZeroPad.sln --configuration Release
      - name: Run protocol tests
        run: dotnet test windows/ZeroPad.sln --configuration Release --no-build
      - name: Publish portable Windows x64 companion
        run: dotnet publish windows/ZeroPad.Server/ZeroPad.Server.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/ZeroPad-Windows-x64/server
      - name: Publish Windows glass companion UI
        run: dotnet publish windows/ZeroPad.Desktop/ZeroPad.Desktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/ZeroPad-Windows-x64
      - name: Upload Windows companion
        uses: actions/upload-artifact@v4
        with:
          name: zeropad-windows-x64
          path: artifacts/ZeroPad-Windows-x64/**
          if-no-files-found: error
          retention-days: 14
