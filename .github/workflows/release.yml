name: Release

# Publish a release by pushing a tag (git tag v0.1.0 && git push origin v0.1.0)
# or by clicking "Run workflow" on the Actions tab and typing a version like v0.1.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create, e.g. v0.1.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  android:
    runs-on: ubuntu-latest
    outputs:
      stable_key: ${{ steps.key.outputs.stable }}
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK platform
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Signing key (yours if the secrets exist, otherwise a one-off key)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          S_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          S_ALIAS: ${{ secrets.KEY_ALIAS }}
          S_KEYPASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zeropad.jks"
            echo "stable=yes" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PASSWORD=$S_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$S_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$S_KEYPASS" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/zeropad.jks" -alias zeropad -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass zptemp123 -keypass zptemp123 -dname "CN=ZeroPad one-off build"
            echo "stable=no" >> "$GITHUB_OUTPUT"
            echo "KEYSTORE_PASSWORD=zptemp123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=zeropad" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=zptemp123" >> "$GITHUB_ENV"
            echo "::warning::No KEYSTORE_B64 secret, so the APK is signed with a one-off key."
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/zeropad.jks" >> "$GITHUB_ENV"
      - name: Unit tests (joystick math + protocol)
        working-directory: android
        run: gradle testDebugUnitTest
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease
      - name: Name and verify the APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "ZeroPad-${TAG}-android.apk"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "ZeroPad-${TAG}-android.apk"
          ls -l "ZeroPad-${TAG}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: zeropad-android
          path: ZeroPad-*-android.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and test
        run: |
          dotnet build windows/ZeroPad.sln --configuration Release
          dotnet test windows/ZeroPad.sln --configuration Release --no-build
      - name: Publish single-file ZeroPad.exe
        run: dotnet publish windows/ZeroPad.Server/ZeroPad.Server.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --output artifacts/ZeroPad
      - name: Zip with the quick-start note
        shell: bash
        run: |
          cp windows/QUICKSTART.txt artifacts/ZeroPad/README.txt
          cd artifacts/ZeroPad
          rm -f *.pdb
          7z a "../../ZeroPad-${TAG}-windows-x64.zip" ZeroPad.exe README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zeropad-windows
          path: ZeroPad-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ needs.android.outputs.stable_key }}
        run: |
          mkdir out
          find assets -type f -exec cp {} out/ \;
          NOTE=""
          if [ "$STABLE" != "yes" ]; then
            NOTE=$'\n\nAndroid note: this APK is signed with a one-off key, so a future ZeroPad release cannot install over it (uninstall first).'
          fi
          cat > notes.md <<EOF
          First ZeroPad release: use your Android phone as an Xbox 360 controller on Windows. Free, open source, no account, no cloud.

          **Windows (PC):**
          1. Install the ViGEmBus driver once: https://github.com/nefarius/ViGEmBus/releases
          2. Unzip ZeroPad-${TAG}-windows-x64.zip and run ZeroPad.exe (allow Private networks in the Firewall prompt).
          3. It shows your PC address and a pairing key.

          **Android (phone):** install ZeroPad-${TAG}-android.apk, type the PC address and pairing key, tap *Open controller*. Phone and PC must be on the same Wi-Fi (or use USB with adb reverse).

          Check it worked: press Win+R, type joy.cpl, open the Xbox 360 controller's Properties and move the sticks.

          The Windows build is not code-signed, so SmartScreen may warn: choose More info, then Run anyway.$NOTE
          EOF
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ZeroPad ${TAG}" --notes-file notes.md
